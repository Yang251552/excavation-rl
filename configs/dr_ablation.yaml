# Domain randomization ablation experiment configurations

variants:
  no_dr:
    description: "No domain randomization — fixed physics parameters"
    domain_randomization:
      enabled: false

  soil_dr:
    description: "Soil parameter randomization only"
    domain_randomization:
      enabled: true
      soil_density_range: [1400.0, 2200.0]
      soil_friction_range: [0.3, 0.9]
      soil_restitution_range: [0.0, 0.2]
      soil_cohesion_range: [0.0, 500.0]
      # Robot params fixed
      joint_friction_scale_range: [1.0, 1.0]
      payload_mass_range: [0.0, 0.0]
      action_noise_std_range: [0.0, 0.0]
      observation_noise_std: 0.0

  full_dr:
    description: "Full domain randomization"
    domain_randomization:
      enabled: true
      soil_density_range: [1400.0, 2200.0]
      soil_friction_range: [0.3, 0.9]
      soil_restitution_range: [0.0, 0.2]
      soil_cohesion_range: [0.0, 500.0]
      heap_height_range: [0.15, 0.35]
      heap_radius_range: [0.2, 0.4]
      heap_position_offset_range: [-0.05, 0.05]
      joint_friction_scale_range: [0.8, 1.2]
      payload_mass_range: [0.0, 0.5]
      action_delay_range: [0, 2]
      action_noise_std_range: [0.0, 0.02]
      observation_noise_std: 0.01

# Evaluation protocol:
# 1. All variants tested on FIXED standard parameters → compare peak performance
# 2. All variants tested on 10 random parameter sets → compare generalization
evaluation:
  fixed_test_params:
    soil_density: 1600.0
    soil_friction: 0.6
    soil_cohesion: 100.0
  num_random_test_sets: 10

seeds: [42, 123, 456]
max_iterations: 1000
